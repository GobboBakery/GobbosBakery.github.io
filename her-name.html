<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Her Name? - Character Select</title>
  <style>
    body {
      margin: 0;
      background: url("HerName/Background/grid_bg.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      font-size: 3em;
      margin: 30px 0 20px;
      text-shadow: 2px 2px 4px black;
    }

    .grid-container {
      width: 100%;
      height: calc(100vh - 140px);
      display: flex;
      align-items: center; 
      justify-content: center; 
      box-sizing: border-box;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 160px);
      grid-auto-rows: 160px;                  
      gap: 28px;
      justify-content: center;
      align-content: center;
    }

    .character {
      width: 160px;
      height: 160px;
      background: black;
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border 0.3s ease;
      border: 2px solid transparent;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
    }

    .character:hover {
      box-shadow: 0 0 20px var(--accent-color, #9866ff);
      border-color: var(--accent-color, #9866ff);
    }

    /* Botón Back */
    .back-button {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: #ff6600;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10001;
    }

    /* Estilos para la vista de personaje */
    .character-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: none;
      overflow-y: auto;
      padding: 40px 20px 20px;
      box-sizing: border-box;
    }

    .character-content {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: flex-start;
      width: 100%;
      gap: 40px;
      margin-top: 0;
    }

    .character-info {
      background-color: rgba(20, 20, 20, 0.88);
      padding: 40px;
      border-radius: 16px;
      max-width: 540px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      text-align: center;
      z-index: 2;
    }

    .character-info h2 {
      color: #9866ff;
      margin-bottom: 20px;
      font-size: 2em;
    }

    .character-info p {
      font-size: 1.05em;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    /* Asegurarse de que la descripción tenga un tamaño adecuado */
    #charDescriptionBox {
      background-color: rgba(255, 255, 255, 0.05); 
      border: 1px solid #9866ff; 
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      font-style: italic;
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 0 10px rgba(152, 102, 255, 0.2);
    }

    .preview-video {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .preview-video video {
      width: 100%;
      height: auto;
    }

    /* Media for character image */
    .character-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation:
        slideIn 0.9s ease-out forwards,
        softGlow 3s ease-in-out infinite;
      opacity: 0; 
    }

    @keyframes slideIn {
      0% { transform: translateX(80%); opacity: 0; }
      100% { transform: translateX(0%); opacity: 1; }
    }

    @keyframes softGlow {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.15)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 15px rgba(255,255,255,0.25)); transform: scale(1.02); }
    }

    body.no-scroll {
      overflow: hidden !important;
    }

    /* Pagination */
    .pagination {
      text-align: center;
      margin: 20px;
    }

    .pagination button {
      background: #222;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 0 5px;
      border-radius: 10px;
      cursor: pointer;
    }

    .pagination button:hover {
      background: #444;
    }

    .pagination button.active {
      background: #9866ff;
      font-weight: bold;
    }

    /* Animación de la grilla */
    .grid.slide-out-left {
      animation: slideOutLeft 0.4s forwards;
    }

    @keyframes slideOutLeft {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(-80px); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- Character View (details of a character) -->
<div id="characterView" class="character-view">
  <button class="back-button" onclick="goBack()">Back</button>
  <div class="character-content">
    <div class="character-media" id="charImage"></div>
    <div class="character-info">
      <h2 id="charName"></h2>
      <p id="charDescription"></p>
      <div class="preview-video" id="charVideo"></div>
    </div>
  </div>
</div>

<!-- MENU -->
<div id="gameMenu" style="
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: black;
  color: white;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  font-family: 'Segoe UI', sans-serif;
  z-index: 99998;
  text-align: center;
">
  
  <!-- START -->
  <button onclick="startExperience()" style="
    padding: 16px 48px;
    font-size: 1.1em;
    background: linear-gradient(135deg, #9866ff, #7a42ff);
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.2s, background 0.3s;
  " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
    Start Experience
  </button>

<!-- CHECKBOX -->
<label style="display: flex; align-items: center; gap: 10px; color: #ccc; font-size: 1em; cursor: pointer;">
  <input type="checkbox" id="skipIntroCheckbox" onchange="toggleWarning()" style="width: 18px; height: 18px; accent-color: #9866ff; cursor: pointer;">
  Don’t show this again
</label>
  <p id="loadWarning" style="display: none; color: #ffcc00; font-size: 0.95em; margin-top: 5px;">
  The page might take longer to load resources.
</p>

<!-- WARNING -->
<div id="noteText" style="
  display: none;
  font-size: 0.9em;
  color: #999;
  margin-top: -10px;
">
  The page might take longer to load resources.
</div>

<!-- BACK  -->
<button onclick="goBack()" style="
  padding: 12px 32px;
  font-size: 1em;
  background: #111;
  color: white;
  border: 1px solid #555;
  border-radius: 10px;
  margin-top: 20px;
  cursor: pointer;
  transition: transform 0.2s, background 0.3s;
" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
  Back
</button>

</div>

<!-- Main Content -->
<div id="mainContent" style="display: none;">
  <h1>Choose Your Dessert</h1>

  <div class="grid-navigation">
    <button class="arrow left" onclick="prevPage()">❮</button>
    <div class="grid" id="characterGrid"></div>
    <button class="arrow right" onclick="nextPage()">❯</button>
  </div>

  <!-- Character Details View -->
  <div class="character-view" id="characterView">
    <div class="character-nav-buttons">
      <button class="btn-nav back" id="backButton" onclick="goBack()">← Back</button>
      <button class="btn-nav prev" id="prevButton" onclick="prevCharacter()">← Previous Girl</button>
      <button class="btn-nav next" id="nextButton" onclick="nextCharacter()">Next Girl ➡</button>
    </div>
    <div class="character-content">
      <div class="character-media" id="charImage"></div>
      <div class="character-info">
        <h2 id="charName"></h2>

        <div class="traits">
          <p><strong>📅 Age:</strong> <span id="charAge"></span></p>
          <p><strong>🌍 Origin:</strong> <span id="charOrigin"></span></p>
          <p><strong>🎭 Personality:</strong> <span id="charPersonality"></span></p>
          <p><strong>⚡ Powers:</strong> <span id="charPowers"></span></p>
          <p><strong>💋 Good at:</strong> <span id="charGoodAt"></span></p>
          <p><strong>🍽️ Flavor:</strong> <span id="charFlavor"></span></p>
        </div>

        <div id="charDescriptionBox">
          <p id="charDescription" style="margin: 0;"></p>
        </div>

        <div class="preview-video" id="charVideo"></div>

        <div class="download-row">
          <a href="#" class="download-button">⬇ 4K</a>
          <a href="#" class="download-button" style="background: linear-gradient(135deg, #aaa, #888);">⬇ FullHD</a>
          <a href="#" class="download-button" style="background: linear-gradient(135deg, #44c767, #28a745);">⬇ Free</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let characterData = {};
let characterKeys = [];
let currentCharacterIndex = 0;

const introVideo = document.getElementById('introVideo');
const introScreen = document.getElementById('introScreen');
const gameMenu = document.getElementById('gameMenu');
const mainContent = document.getElementById('mainContent');

const selectSound = new Audio('HerName/Sound/select.mp3');
selectSound.volume = 0.6;
selectSound.preload = 'auto';

fetch('characters.json')
  .then(res => res.json())
  .then(data => {
    characterData = data;
    characterKeys = Object.keys(data);
    generateCharacterGrid();
    preloadCharacterAssets();

    if (localStorage.getItem('skipIntroForever') === 'true') {
      showMainContent();
    } else {
      gameMenu.style.display = 'flex';
    }
  });

// Preload assets for characters
function preloadCharacterAssets() {
  Object.values(characterData).forEach(char => {
    const img = new Image();
    img.src = char.img;

    const bg = new Image();
    bg.src = char.background;

    const hiddenVideo = document.createElement('video');
    hiddenVideo.src = char.video;
    hiddenVideo.preload = 'auto';
    hiddenVideo.style.display = 'none';
    document.body.appendChild(hiddenVideo);
  });
}

let currentPage = 1;
const charactersPerPage = 16;

// Generate character grid with pagination
function generateCharacterGrid(direction = null) {
  const grid = document.getElementById('characterGrid');
  
  if (!grid) {
    console.error('Grid element not found!');
    return;
  }

  // Handle grid sliding animations
  if (direction === 'next') {
    grid.classList.add('slide-out-left');
  } else if (direction === 'prev') {
    grid.classList.add('slide-out-right');
  }

  setTimeout(() => {
    grid.classList.remove('slide-out-left', 'slide-out-right');
    grid.innerHTML = '';

    const totalPages = Math.ceil(characterKeys.length / charactersPerPage);
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * charactersPerPage;
    const end = start + charactersPerPage;
    const visibleCharacters = characterKeys.slice(start, end);

    // Create character cards
    visibleCharacters.forEach((key, index) => {
      const char = characterData[key];
      const card = document.createElement('div');
      card.className = 'character';
      card.style.setProperty('--accent-color', char.accent);
      card.onclick = () => openCharacter(key);
      card.innerHTML = `<img src="${char.icon}" alt="${key}">`;
      if (char.isNew) card.classList.add('new');
      card.dataset.index = index;
      grid.appendChild(card);
    });

    // Add placeholders if not enough characters to fill the grid
    const placeholdersToAdd = charactersPerPage - visibleCharacters.length;
    for (let i = 0; i < placeholdersToAdd; i++) {
      const placeholder = document.createElement('div');
      placeholder.className = 'character placeholder';
      placeholder.textContent = 'Coming Soon';
      grid.appendChild(placeholder);
    }

    // Animate sliding in/out of the grid
    if (direction === 'next') {
      grid.classList.add('slide-in-right');
    } else if (direction === 'prev') {
      grid.classList.add('slide-in-left');
    }

    setTimeout(() => {
      grid.classList.remove('slide-in-left', 'slide-in-right');
    }, 400);

    // Animate each card
    const visibleCards = grid.querySelectorAll('.character');
    visibleCards.forEach((card, index) => {
      setTimeout(() => {
        card.classList.add('animated-entry');
        card.style.animationDelay = `${index * 80}ms`;
      }, 100);
    });

    updatePaginationButtons();
  }, 250);
}

// Open the selected character details
function openCharacter(key) {
  const char = characterData[key];
  currentCharacterIndex = characterKeys.indexOf(key); 
  selectSound.currentTime = 0;
  selectSound.play();

  const view = document.getElementById('characterView');
  const img = document.getElementById('charImage');
  const vid = document.getElementById('charVideo');

  // Check for valid elements
  if (!view || !img || !vid) {
    console.error('Character view or media elements not found!');
    return;
  }

  // Set background and character info
  view.style.backgroundImage = `url(${char.background})`;
  view.style.display = 'flex';

  const backBtn = document.getElementById('backButton');
  const nextBtn = document.getElementById('nextButton');
  const prevBtn = document.getElementById('prevButton');

  // Set the navigation buttons' styles
  if (backBtn && nextBtn && prevBtn) {
    backBtn.style.background = `linear-gradient(135deg, ${char.accent}, #222)`;
    nextBtn.style.background = `linear-gradient(135deg, ${char.accent}, #444)`;
    prevBtn.style.background = `linear-gradient(135deg, ${char.accent}, #444)`;
  }

  // Set character details
  document.getElementById('charName').textContent = char.name;
  document.getElementById('charAge').textContent = char.age;
  document.getElementById('charOrigin').textContent = char.origin;
  document.getElementById('charPersonality').textContent = char.personality;
  document.getElementById('charPowers').textContent = char.powers;
  document.getElementById('charGoodAt').textContent = char.goodAt;
  document.getElementById('charFlavor').textContent = char.flavor;
  document.getElementById('charDescription').textContent = char.description;

  document.getElementById('charName').style.color = char.accent;
  const descBox = document.getElementById('charDescriptionBox');
  descBox.style.border = `1px solid ${char.accent}`;
  descBox.style.boxShadow = `0 0 10px ${char.accent}66`;

  // Set the media content
  vid.innerHTML = `<video src="${char.video}" autoplay muted loop playsinline preload="auto"></video>`;
  img.innerHTML = `<img src="${char.img}" alt="${char.name}">`;

  // Hide the grid and show character view
  document.getElementById('characterGrid').style.display = 'none';
  document.querySelector('.arrow.left').style.display = 'none';
  document.querySelector('.arrow.right').style.display = 'none';
  document.querySelector('h1').style.display = 'none';
  document.querySelector('.pagination').style.display = 'none';
  document.body.classList.add('no-scroll');

  view.style.display = 'block';
}

// Close character details and return to grid
function closeCharacter() {
  const characterGrid = document.getElementById('characterGrid');
  const characterView = document.getElementById('characterView');

  if (!characterGrid || !characterView) {
    console.error('Character grid or view not found!');
    return;
  }

  // Hide character view and show grid again
  characterGrid.style.display = 'grid';  // Show the grid
  characterView.style.display = 'none'; // Hide the character view

  // Show the pagination controls
  document.querySelector('.arrow.left').style.display = 'inline-block';
  document.querySelector('.arrow.right').style.display = 'inline-block';
  document.querySelector('h1').style.display = 'block';
  document.querySelector('.pagination').style.display = 'block';

  // Restore scrolling
  document.body.classList.remove('no-scroll');
}

// Pagination controls
function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    generateCharacterGrid();
  }
}

function nextPage() {
  const totalPages = Math.ceil(characterKeys.length / charactersPerPage);
  if (currentPage < totalPages) {
    currentPage++;
    generateCharacterGrid();
  }
}

function updatePaginationButtons() {
  // Optional: Add logic to update pagination buttons, e.g., disabling them on the first/last page
}

// Start the experience
function startExperience() {
  if (document.getElementById('skipIntroCheckbox').checked) {
    localStorage.setItem('skipIntroForever', 'true');
    document.getElementById('noteText').style.display = 'block';
    setTimeout(() => showMainContent(), 2500);
  } else {
    gameMenu.style.display = 'none';
    introScreen.style.display = 'flex';
    introScreen.style.zIndex = '99999';
    introVideo.style.display = 'block';
    void introScreen.offsetWidth;

    introVideo.currentTime = 0;
    introVideo.volume = 0.8;
    introVideo.play();

    introVideo.addEventListener('ended', showMainContent);
    setTimeout(showMainContent, 15000);
  }
}

function showMainContent() {
  introVideo.pause();
  introVideo.currentTime = 0;
  introScreen.style.display = 'none';
  gameMenu.style.display = 'none';

  mainContent.style.display = 'block';
  generateCharacterGrid();
  updatePaginationButtons();
  document.querySelector('.pagination').style.display = 'block';
}

function goBack() {
  closeCharacter();
  generateCharacterGrid();  
}


</script>

</body>
</html>
