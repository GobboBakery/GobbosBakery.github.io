<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Her Name? - Character Select</title>
  <style>
    /* Estilos generales y de la grilla de personajes */
    body {
      margin: 0;
      background: url("HerName/Background/grid_bg.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      font-size: 3em;
      margin: 30px 0 20px;
      text-shadow: 2px 2px 4px black;
    }

    .grid-container {
      width: 100%;
      height: calc(100vh - 140px);
      display: flex;
      align-items: center; 
      justify-content: center; 
      box-sizing: border-box;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 160px);
      grid-auto-rows: 160px;                  
      gap: 28px;
      justify-content: center;
      align-content: center;
    }

    .character {
      width: 160px;
      height: 160px;
      background: black;
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border 0.3s ease;
      border: 2px solid transparent;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
    }

    .character:hover {
      box-shadow: 0 0 20px var(--accent-color, #9866ff);
      border-color: var(--accent-color, #9866ff);
    }

    /* Características del botón de retroceso */
    .back-button {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: #ff6600;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10001;
    }

    /* Otros estilos */
    body.no-scroll {
      overflow: hidden !important;
    }
  </style>
</head>
<body>

<!-- INTRO SCREEN (video overlay, initially hidden) -->
<div id="introScreen" style="
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: black;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 99999;
">
  <video id="introVideo"
    src="HerName/Intro/intro.mp4"
    playsinline
    preload="auto"
    style="width: 100vw; height: 100vh; object-fit: cover;">
  </video>
</div>

<!-- MENU -->
<div id="gameMenu" style="display: none;">
  <button onclick="startExperience()">Start Experience</button>
  <label>
    <input type="checkbox" id="skipIntroCheckbox"> Don’t show this again
  </label>
  <p id="loadWarning" style="display: none;">The page might take longer to load resources.</p>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent" style="display: none;">
  <h1>Choose Your Character</h1>
  <div class="grid-container">
    <div class="grid" id="characterGrid"></div>
  </div>

  <div class="character-view" id="characterView">
    <button class="back-button" onclick="goBack()">Back</button>
    <div class="character-content">
      <div class="character-media" id="charImage"></div>
      <div class="character-info">
        <h2 id="charName"></h2>
        <p id="charDescription"></p>
        <div class="preview-video" id="charVideo"></div>
      </div>
    </div>
  </div>
</div>

<script>
// Cargar datos de los personajes y gestionar la vista
let characterData = {};
let characterKeys = [];
let currentCharacterIndex = 0;

const introVideo = document.getElementById('introVideo');
const introScreen = document.getElementById('introScreen');
const gameMenu = document.getElementById('gameMenu');
const mainContent = document.getElementById('mainContent');

const selectSound = new Audio('HerName/Sound/select.mp3');
selectSound.volume = 0.6;
selectSound.preload = 'auto';

fetch('characters.json')
  .then(res => res.json())
  .then(data => {
    characterData = data;
    characterKeys = Object.keys(data);
    generateCharacterGrid();
    preloadCharacterAssets();

    if (localStorage.getItem('skipIntroForever') === 'true') {
      showMainContent();
    } else {
      gameMenu.style.display = 'flex';
    }
  });

// Preload assets for characters
function preloadCharacterAssets() {
  Object.values(characterData).forEach(char => {
    const img = new Image();
    img.src = char.img;

    const bg = new Image();
    bg.src = char.background;

    const hiddenVideo = document.createElement('video');
    hiddenVideo.src = char.video;
    hiddenVideo.preload = 'auto';
    hiddenVideo.style.display = 'none';
    document.body.appendChild(hiddenVideo);
  });
}

let currentPage = 1;
const charactersPerPage = 16;

// Generar la grilla de personajes con paginación
function generateCharacterGrid(direction = null) {
  const grid = document.getElementById('characterGrid');
  
  if (!grid) {
    console.error('Grid element not found!');
    return;
  }

  if (direction === 'next') {
    grid.classList.add('slide-out-left');
  } else if (direction === 'prev') {
    grid.classList.add('slide-out-right');
  }

  setTimeout(() => {
    grid.classList.remove('slide-out-left', 'slide-out-right');
    grid.innerHTML = '';

    const totalPages = Math.ceil(characterKeys.length / charactersPerPage);
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * charactersPerPage;
    const end = start + charactersPerPage;
    const visibleCharacters = characterKeys.slice(start, end);

    visibleCharacters.forEach((key, index) => {
      const char = characterData[key];
      const card = document.createElement('div');
      card.className = 'character';
      card.style.setProperty('--accent-color', char.accent);
      card.onclick = () => openCharacter(key);
      card.innerHTML = `<img src="${char.icon}" alt="${key}">`;
      if (char.isNew) card.classList.add('new');
      card.dataset.index = index;
      grid.appendChild(card);
    });

    // Placeholder en caso de que no haya suficientes personajes
    const placeholdersToAdd = charactersPerPage - visibleCharacters.length;
    for (let i = 0; i < placeholdersToAdd; i++) {
      const placeholder = document.createElement('div');
      placeholder.className = 'character placeholder';
      placeholder.textContent = 'Coming Soon';
      grid.appendChild(placeholder);
    }

    // Animación de entrada
    if (direction === 'next') {
      grid.classList.add('slide-in-right');
    } else if (direction === 'prev') {
      grid.classList.add('slide-in-left');
    }

    setTimeout(() => {
      grid.classList.remove('slide-in-left', 'slide-in-right');
    }, 400);

  }, 250);
}

// Abrir detalles de personaje
function openCharacter(key) {
  const char = characterData[key];
  currentCharacterIndex = characterKeys.indexOf(key); 
  selectSound.currentTime = 0;
  selectSound.play();

  const view = document.getElementById('characterView');
  const img = document.getElementById('charImage');
  const vid = document.getElementById('charVideo');

  if (!view || !img || !vid) {
    console.error('Character view or media elements not found!');
    return;
  }

  view.style.backgroundImage = `url(${char.background})`;
  view.style.display = 'flex';

  // Set character info
  document.getElementById('charName').textContent = char.name;
  document.getElementById('charDescription').textContent = char.description;

  // Set media (image and video)
  vid.innerHTML = `<video src="${char.video}" autoplay muted loop playsinline preload="auto"></video>`;
  img.innerHTML = `<img src="${char.img}" alt="${char.name}">`;

  // Hide grid and show character view
  document.getElementById('characterGrid').style.display = 'none';
  document.body.classList.add('no-scroll');
  view.style.display = 'block';
}

// Cerrar detalles de personaje
function closeCharacter() {
  const view = document.getElementById('characterView');
  const grid = document.getElementById('characterGrid');

  if (!view || !grid) {
    console.error('Character view or grid not found!');
    return;
  }

  // Mostrar la grilla y restaurar el scroll
  grid.style.display = 'grid';
  document.body.classList.remove('no-scroll');
  view.style.display = 'none';
}

// Función del botón Back
function goBack() {
  closeCharacter();
}

// Comenzar la experiencia (con intro)
function startExperience() {
  if (document.getElementById('skipIntroCheckbox').checked) {
    localStorage.setItem('skipIntroForever', 'true');
    document.getElementById('noteText').style.display = 'block';
    setTimeout(() => showMainContent(), 2500);
  } else {
    gameMenu.style.display = 'none';
    introScreen.style.display = 'flex';
    introVideo.style.display = 'block';
    introVideo.currentTime = 0;
    introVideo.volume = 0.8;
    introVideo.play();

    introVideo.addEventListener('ended', showMainContent);
    setTimeout(showMainContent, 15000);
  }
}

// Mostrar contenido principal
function showMainContent() {
  introVideo.pause();
  introVideo.currentTime = 0;
  introScreen.style.display = 'none';
  gameMenu.style.display = 'none';

  mainContent.style.display = 'block';
  generateCharacterGrid();
}
</script>

</body>
</html>
